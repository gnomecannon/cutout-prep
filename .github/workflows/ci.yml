name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
            extras: dev
          - os: ubuntu-latest
            python: '3.12'
            extras: 'dev,raw,cutout'
          - os: windows-latest
            python: '3.12'
            extras: 'dev,raw,cutout'
          - os: macos-latest
            python: '3.12'
            extras: 'dev,raw,cutout'
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and test dependencies
        run: python -m pip install ".[${{ matrix.extras }}]"
      - name: Run focused regression tests
        run: python -m unittest discover -s tests -v
      - name: Check public source boundary
        run: python tools/check_public_source.py
      - name: Check installed entry point
        run: cutout-prep --help
      - name: Check RAW decoder extra
        if: contains(matrix.extras, 'raw')
        run: python -c "from cutout_prep.raw_decode import decoder; r=decoder(); print(r.__version__, r.libraw_version)"
      - name: Check detailed cutout CPU runtime
        if: contains(matrix.extras, 'cutout')
        run: python -c "import onnxruntime as o; assert 'CPUExecutionProvider' in o.get_available_providers(); print(o.__version__)"
      - name: Build source and wheel distributions
        run: python -m build
      - name: Reinstall wheel without source import
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "${RUNNER_TEMP}"
          python -m cutout_prep --help
